[package]
name = "liney-screen-x11"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
libc = "0.2"
openh264 = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = { version = "0.13.2", features = ["composite", "damage", "randr", "shm", "xfixes", "xinerama"] }
