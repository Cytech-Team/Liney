name: Electron Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build AppImage, DEB and RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install Electron Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 libatk-bridge2.0-0 rpm file patchelf libarchive-tools xvfb xdotool
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: Build engine and desktop packages
        run: npm run electron:build
      - name: Verify and smoke-test AppImage, DEB and RPM
        run: bash scripts/verify-linux-packages.sh release-electron
      - name: Upload desktop package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: |
            release-electron/*.AppImage
            release-electron/*.deb
            release-electron/*.rpm
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Build Electron Flatpak
    needs: release-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: release-electron
      - name: Install Flatpak build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder file elfutils xvfb
      - name: Set up Flathub runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Electron Flatpak (without FUSE)
        run: npm run build:flatpak
      - name: Verify Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          BUNDLE="release-electron/Liney-Electron-Preview-${VERSION}-x86_64.flatpak"
          test -s "$BUNDLE"
          ls -lh "$BUNDLE"
          flatpak build-bundle --help >/dev/null
          flatpak install --user --noninteractive --assumeyes --bundle "$BUNDLE"
          flatpak info --show-ref com.cyoriasmp.liney | grep -Fx "app/com.cyoriasmp.liney/x86_64/preview"
          METADATA="$(flatpak info --show-metadata com.cyoriasmp.liney)"
          grep -Fx 'name=com.cyoriasmp.liney' <<<"$METADATA"
          grep -Fx 'runtime=org.gnome.Platform/x86_64/50' <<<"$METADATA"
          grep -Fx 'command=liney-electron-preview' <<<"$METADATA"
          LOG="$(mktemp)"
          set +e
          timeout -k 2s 60s xvfb-run -a --server-args='-screen 0 1280x800x24' \
            flatpak run --user \
              --env=LINEY_DISABLE_AUTO_RESTORE=1 \
              --env=LINEY_ELECTRON_SMOKE=1 \
              --env=LINEY_ELECTRON_SMOKE_SKIP_SHORTCUT_INPUT=1 \
              com.cyoriasmp.liney >"$LOG" 2>&1
          SMOKE_STATUS=$?
          set -e
          cat "$LOG"
          test "$SMOKE_STATUS" -eq 0
          for marker in \
            '"authDialog":true' \
            '"logoLoaded":true' \
            '"menuHidden":true' \
            '"nativeEditMenu":true' \
            '"shortcutInputSkipped":true' \
            '"nativeHelpers":5' \
            '"enginePong":true'; do
            grep -Fq "$marker" "$LOG"
          done
          flatpak uninstall --user --noninteractive --assumeyes com.cyoriasmp.liney
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: liney-electron-flatpak-${{ github.sha }}
          path: release-electron/*.flatpak
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-linux
      - flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: release-electron
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: liney-electron-flatpak-${{ github.sha }}
          path: release-electron
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-electron/*.AppImage release-electron/*.deb release-electron/*.rpm release-electron/*.flatpak
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-electron/*.AppImage
            release-electron/*.deb
            release-electron/*.rpm
            release-electron/*.flatpak
