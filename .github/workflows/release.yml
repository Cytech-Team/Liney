name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-webview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebView (Tauri) build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      - run: bun run engine:build
      - name: Build WebView release bundle (tauri)
        run: bun run build
      - name: Prove the binary is the WebView (WebKit) build
        run: |
          BIN=$(find src-tauri/target/release -maxdepth 1 -type f -name liney -print -quit)
          ldd "$BIN" | tee /tmp/liney-ldd.txt
          grep -q 'libwebkit2gtk' /tmp/liney-ldd.txt
          ! grep -Eiq 'libgtk-4' /tmp/liney-ldd.txt
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          set -e
          APP=$(find src-tauri/target/release -maxdepth 1 -type f -name liney -print -quit)
          ENGINE=$(find src-tauri/target/release -maxdepth 1 -type f -name liney-engine -print -quit)
          cp "$APP" dist/liney
          cp "$ENGINE" dist/liney-engine
          sha256sum dist/liney dist/liney-engine > dist/liney-0.1.0.sha256
          mkdir -p dist/arch-input
          cp "$APP" dist/arch-input/liney
          cp "$ENGINE" dist/arch-input/liney-engine
      - uses: actions/upload-artifact@v4
        with:
          name: liney-linux-webview
          path: |
            dist/liney
            dist/liney-engine
            dist/liney-0.1.0.sha256
            dist/arch-input/**
