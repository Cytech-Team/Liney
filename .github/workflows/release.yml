name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgdk-pixbuf-2.0-0 \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm \
            file \
            curl

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log(require("./package.json").version)')"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "Tag v${tag} does not match package version ${version}" >&2
            exit 1
          }

      - name: Build and verify release artifacts
        env:
          NO_STRIP: 'true'
        run: bun run release:local

      - name: Prove WebKit/Tauri binary linkage
        shell: bash
        run: |
          set -euo pipefail
          ldd src-tauri/target/release/liney | tee /tmp/liney-ldd.txt
          grep -q 'libwebkit2gtk' /tmp/liney-ldd.txt
          grep -q 'libgtk-3' /tmp/liney-ldd.txt
          ! grep -q 'not found' /tmp/liney-ldd.txt

      - uses: actions/upload-artifact@v4
        with:
          name: liney-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/Liney-*-linux-${{ matrix.arch }}.AppImage
            release/Liney-*-linux-${{ matrix.arch }}.deb
            release/Liney-*-linux-${{ matrix.arch }}.rpm
            release/Liney-*-linux-${{ matrix.arch }}.tar.gz
            release/Liney-*-linux-${{ matrix.arch }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: liney-linux-*
          path: release-assets
          merge-multiple: true

      - name: Verify staged release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.sha256' -print -quit)"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
