name: Electron Linux Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        type: choice
        options:
          - preview
          - stable
        default: preview
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      channel:
        description: Release channel
        required: false
        type: string
        default: preview
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
    steps:
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          channel=preview
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            channel="${INPUT_CHANNEL:-preview}"
          elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=stable
          fi
          ref="${INPUT_REF:-${GITHUB_REF}}"
          tag=""
          if [[ "$ref" == refs/tags/v* ]]; then
            tag="${ref#refs/tags/}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install release gate dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file patchelf
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag version
        if: steps.channel.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.channel.outputs.tag }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
      # A release must never publish artifacts that skipped tests, lint, the
      # Electron engine bundle or the React production build.
      - name: Release gate (tests, lint, builds, diff check)
        run: npm run verify:release

  release-linux:
    name: Build AppImage, DEB and RPM
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install Electron Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 libatk-bridge2.0-0 rpm file patchelf libarchive-tools xvfb xdotool
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag version
        if: needs.verify.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
      - name: Build engine and desktop packages
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: node scripts/electron-build.mjs "$CHANNEL"
      - name: Verify and smoke-test AppImage, DEB and RPM
        env:
          LINEY_RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
        run: bash scripts/verify-linux-packages.sh release-electron
      - name: Upload desktop package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: |
            release-electron/*.AppImage
            release-electron/*.deb
            release-electron/*.rpm
            release-electron/*.yml
            release-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Build Electron Flatpak
    needs: [verify, release-linux]
    # Flathub needs its own stable app id and branch; a stable tag must not ship
    # a preview-branded Flatpak.
    if: needs.verify.outputs.channel != 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: release-electron
      - name: Install Flatpak build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder file elfutils xvfb
      - name: Set up Flathub runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Electron Flatpak (without FUSE)
        run: npm run build:flatpak
      - name: Verify Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          BUNDLE="release-electron/Liney-Electron-Preview-${VERSION}-x86_64.flatpak"
          test -s "$BUNDLE"
          ls -lh "$BUNDLE"
          flatpak build-bundle --help >/dev/null
          flatpak install --user --noninteractive --assumeyes --bundle "$BUNDLE"
          flatpak info --show-ref com.cyoriasmp.liney | grep -Fx "app/com.cyoriasmp.liney/x86_64/preview"
          METADATA="$(flatpak info --show-metadata com.cyoriasmp.liney)"
          grep -Fx 'name=com.cyoriasmp.liney' <<<"$METADATA"
          grep -Fx 'runtime=org.gnome.Platform/x86_64/50' <<<"$METADATA"
          grep -Fx 'command=liney-electron-preview' <<<"$METADATA"
          LOG="$(mktemp)"
          set +e
          timeout -k 2s 60s xvfb-run -a --server-args='-screen 0 1280x800x24' \
            flatpak run --user \
              --env=LINEY_DISABLE_AUTO_RESTORE=1 \
              --env=LINEY_ELECTRON_SMOKE=1 \
              --env=LINEY_ELECTRON_SMOKE_SKIP_SHORTCUT_INPUT=1 \
              com.cyoriasmp.liney >"$LOG" 2>&1
          SMOKE_STATUS=$?
          set -e
          cat "$LOG"
          test "$SMOKE_STATUS" -eq 0
          for marker in \
            '"authDialog":true' \
            '"logoLoaded":true' \
            '"menuHidden":true' \
            '"nativeEditMenu":true' \
            '"shortcutInputSkipped":true' \
            '"nativeHelpers":5' \
            '"cspViolations":0' \
            '"enginePong":true'; do
            grep -Fq "$marker" "$LOG"
          done
          flatpak uninstall --user --noninteractive --assumeyes com.cyoriasmp.liney
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liney-electron-flatpak-${{ github.sha }}
          path: release-electron/*.flatpak
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: ${{ !cancelled() && needs.verify.outputs.tag != '' && needs.release-linux.result == 'success' }}
    needs:
      - verify
      - release-linux
      - flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: liney-electron-packages-${{ github.sha }}
          path: release-electron
      - name: Download Flatpak bundle
        if: needs.verify.outputs.channel != 'stable'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: liney-electron-flatpak-${{ github.sha }}
          path: release-electron
      - name: Collect release assets
        shell: bash
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-electron/*.AppImage release-electron/*.deb release-electron/*.rpm release-electron/*.yml release-assets/
          cp release-electron/*.blockmap release-assets/ 2>/dev/null || echo "No blockmap (differential update disabled)"
          if [ "$CHANNEL" != "stable" ]; then
            cp release-electron/*.flatpak release-assets/
          fi
          ls -lh release-assets
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.channel != 'stable' }}
          files: release-assets/*
