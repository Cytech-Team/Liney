[package]
name = "liney"
version = "0.1.0"
edition = "2021"
description = "Native GTK4 LINE desktop client for Linux"
license = "LicenseRef-TLL-1.0"

[dependencies]
gtk4 = "0.10"
gdk-pixbuf = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
base64 = "0.22"
ksni = { version = "0.3.6", features = ["blocking"] }
cairo-rs = { version = "0.21", features = ["png"] }
