<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <title>Liney Connector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Liney Connector</h1>
      <p id="status">กำลังเช็ก...</p>
      <label>Runner URL<input id="runner-url" autocomplete="off" spellcheck="false"></label>
      <label>Runner token<input id="runner-token" type="password" autocomplete="off" spellcheck="false" placeholder="วาง token จาก Home Server"></label>
      <label class="row"><input id="runner-enabled" type="checkbox"> เปิดใช้ Home Runner</label>
      <button id="save">บันทึก</button>
      <button id="check">เช็ก runner</button>
      <button id="open-app">เปิด Liney Web App</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
